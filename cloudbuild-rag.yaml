# Pipeline dédié au build et déploiement du service RAG pgvector (03_rag_server.py).
# Inclut sentence-transformers (nomic-embed-text-v1.5) + Qwen2.5-1.5B via llama-cpp.
#
# Le 1,5 B a remplacé le 0,5 B après mesure au benchmark : ce dernier produisait
# des réponses juridiques fausses (préavis « 3 mois » en zone tendue au lieu d'un
# mois) et des hallucinations en boucle sur les listes de communes, que le 1,5 B
# corrige. Coût : latence ~2,5× (≈ 30-40 s à chaud). Retour au 0,5 B possible en
# un build (voir le commentaire de l'étape de téléchargement).
#
# Déclencher MANUELLEMENT quand rag/ est modifié :
#   gcloud builds submit --config cloudbuild-rag.yaml .
#
# Machine E2_HIGHCPU_8 pour compiler llama-cpp-python.

substitutions:
  _REGION: europe-west1
  _REGISTRY: europe-west1-docker.pkg.dev/homepedia-493013/homepedia
  _RAG_SERVICE: homepedia-rag

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s

steps:
  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 1 : Build image RAG (sentence-transformers nomic pré-chargé pour le
  # retrieval ; génération déléguée à Gemini, plus de modèle local à embarquer).
  # ─────────────────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-rag
    args:
      - build
      - -f
      - ./rag/Dockerfile.prod
      - -t
      - ${_REGISTRY}/rag:latest
      - --cache-from
      - ${_REGISTRY}/rag:latest
      - ./rag
    waitFor: ['-']

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 3 : Push image RAG
  # ─────────────────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-rag
    args: [push, "${_REGISTRY}/rag:latest"]
    waitFor: [build-rag]

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 4 : Déployer le service RAG sur Cloud Run
  # ─────────────────────────────────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-rag
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_RAG_SERVICE}
      - --image=${_REGISTRY}/rag:latest
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8002
      # La génération passe par Gemini (API) : plus de LLM local à charger. Il ne
      # reste que les embeddings nomic (retrieval), légers. RAM et CPU divisés.
      - --memory=4Gi
      - --cpu=2
      - --min-instances=0
      - --max-instances=2
      - --timeout=300
      - --set-env-vars=USE_LOCAL_EMBED=true,USE_LOCAL_LLM=false,GEMINI_MODEL=gemini-flash-lite-latest,POSTGRES_HOST=aws-0-eu-west-1.pooler.supabase.com,POSTGRES_PORT=6543,POSTGRES_DB=postgres,POSTGRES_USER=postgres.iugsfmvqddburvufzacy,POSTGRES_SSLMODE=require
      - --update-secrets=POSTGRES_PASSWORD=homepedia-supabase-password:latest,GEMINI_API_KEY=gemini-api-key:latest
      - --quiet
    waitFor: [push-rag]

  # ─────────────────────────────────────────────────────────────────────────────
  # ÉTAPE 5 : Récupérer l'URL du service RAG et afficher le résumé
  # ─────────────────────────────────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: summary
    entrypoint: bash
    args:
      - -c
      - |
        RAG_URL=$$(gcloud run services describe ${_RAG_SERVICE} \
          --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo "N/A")
        echo "==================================="
        echo "  RAG DEPLOYE"
        echo "==================================="
        echo "  Service : ${_RAG_SERVICE}"
        echo "  URL     : $$RAG_URL"
        echo "  Health  : $$RAG_URL/rag/health"
        echo "  Embed   : sentence-transformers nomic-embed-text-v1.5"
        echo "  LLM     : Qwen2.5-1.5B (llama-cpp)"
        echo "==================================="
        echo ""
        echo "Mettre à jour le backend avec RAG_SERVICE_URL=$$RAG_URL"
    waitFor: [deploy-rag]

images:
  - ${_REGISTRY}/rag:latest
